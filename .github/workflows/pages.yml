name: Deploy Second-Brain Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Pages source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site_source
          mkdir -p _site_source
          cp README.md _site_source/index.md
          cp .github/pages/index.html _site_source/index.html
          printf '%s\n' 'title: Second-Brain' > _site_source/_config.yml
          cp AI_MEMORY.md _site_source/AI_MEMORY.md
          cp SECURITY.md _site_source/SECURITY.md
          cp GITHUB_PROJECTS.md _site_source/GITHUB_PROJECTS.md
          cp -R 'SYSTEM CORE' _site_source/'SYSTEM CORE'
          cp -R TOPICS _site_source/TOPICS

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
