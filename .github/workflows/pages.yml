name: Build Second-Brain Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp docs/index.md _site/index.md
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Second-Brain Knowledge Portal</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; line-height: 1.55; }
              code { background: #f4f4f4; padding: 2px 5px; border-radius: 4px; }
              a { text-decoration: none; }
            </style>
          </head>
          <body>
            <h1>Second-Brain Knowledge Portal</h1>
            <p>Presentation and navigation layer for the Second-Brain repository. Repository files remain the source of truth.</p>
            <h2>System</h2>
            <ul>
              <li><a href="https://github.com/hiephnp-oos/Second-Brain/blob/main/AI_MEMORY.md">AI Memory</a></li>
              <li><a href="https://github.com/hiephnp-oos/Second-Brain/blob/main/WORKFLOW.md">Workflow</a></li>
              <li><a href="https://github.com/hiephnp-oos/Second-Brain/blob/main/REPOSITORY_CONTRACT.md">Repository Contract</a></li>
              <li><a href="https://github.com/hiephnp-oos/Second-Brain">Repository</a></li>
            </ul>
            <h2>Topics</h2>
            <p>Use <a href="https://github.com/hiephnp-oos/Second-Brain/blob/main/AI_MEMORY.md#6-active-topics">AI_MEMORY.md → Active Topics</a> as the authoritative topic index.</p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
