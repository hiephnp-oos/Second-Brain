name: Validate Second-Brain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validator self-tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate repository contracts
        run: python scripts/validate_second_brain.py
