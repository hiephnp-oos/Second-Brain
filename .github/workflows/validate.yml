name: Validate Second-Brain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate repository contracts
        id: validate
        run: python scripts/validate_second_brain.py

      - name: Publish required legacy status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \              --field state=success \              --field context=validate \              --field description='Repository contract validation' \              --field target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          else
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
              -f state=failure \              --field context=validate \              --field description='Repository contract validation failed' \              --field target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          fi
