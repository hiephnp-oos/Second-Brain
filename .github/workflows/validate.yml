name: Validate Second-Brain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate repository contracts
        id: validate
        run: python scripts/validate_second_brain.py

      - name: Publish required legacy status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ steps.validate.outcome }}
          STATUS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_MERGE_SHA: ${{ github.sha }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["STATUS_STATE"] == "success" else "failure"
          payload = {
              "state": state,
              "context": "validate",
              "description": "Repository contract validation" if state == "success" else "Repository contract validation failed",
              "target_url": os.environ["STATUS_URL"],
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          for sha in dict.fromkeys([os.environ["STATUS_HEAD_SHA"], os.environ["STATUS_MERGE_SHA"]]):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/hiephnp-oos/Second-Brain/statuses/{sha}",
                  data=json.dumps(payload).encode(), headers=headers, method="POST")
              with urllib.request.urlopen(req) as response:
                  print(response.read().decode())
          PY
