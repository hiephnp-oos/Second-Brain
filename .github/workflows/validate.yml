name: Validate Second-Brain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validator self-tests
        id: validator_self_tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate repository contracts
        id: repository_contracts
        run: python scripts/validate_second_brain.py

      # Publish the required legacy commit-status context as well as the native Actions check.
      # Some repository protection rules require the exact status context "validate".
      - name: Publish required validate commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_TESTS_OUTCOME: ${{ steps.validator_self_tests.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.repository_contracts.outcome }}
        run: |
          if [ "$SELF_TESTS_OUTCOME" = "success" ] && [ "$CONTRACTS_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="Repository validation passed"
          else
            STATE="failure"
            DESCRIPTION="Repository validation failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="validate" \
            -f description="$DESCRIPTION"
