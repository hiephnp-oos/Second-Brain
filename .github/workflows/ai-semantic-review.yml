name: AI Semantic Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-semantic-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  semantic_review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check AI review configuration
        id: config
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AI Semantic Review is skipped because OPENAI_API_KEY is not configured or is unavailable for this PR."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Second-Brain semantic review
        if: steps.config.outputs.enabled == 'true'
        uses: dlidstrom/genai-code-review@v3.0.8
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}
          openai_model: "gpt-4o"
          openai_temperature: 0.1
          openai_max_tokens: 2500
          mode: patch
          language: en
          include_regex: '^(AI_MEMORY\.md|WORKFLOW\.md|REPOSITORY_CONTRACT\.md|README\.md|TOPICS/.*|scripts/.*|\.github/.*)$'
          custom_prompt: |
            You are the semantic reviewer for the Second-Brain repository.

            Review the proposed pull request change, not the author.
            Do not rewrite files, create commits, or invent requirements.
            Do not give a numeric score or overall quality rating.

            Second-Brain operating principles:
            - GitHub repository state is the source of truth.
            - AI_MEMORY.md is the global memory and topic registry.
            - WORKFLOW.md is the canonical operating workflow.
            - REPOSITORY_CONTRACT.md defines repository invariants and completion.
            - README.md is human-oriented navigation, not a duplicate registry.
            - A logical multi-file change must reach one coherent target state.
            - Replacements, renames, migrations, and cleanup require both positive and negative verification.
            - Obsolete, duplicate, placeholder, temporary, or superseded active artifacts must not remain unless explicitly retained by design.
            - Registry, routing, README, references, workflow, contract, and validator changes must be synchronized when their dependencies are affected.
            - Deterministic validation is authoritative for machine-checkable invariants; this review is only a secondary semantic signal.
            - Prefer simple, maintainable changes over unnecessary infrastructure.

            Review specifically for:
            1. Target-state completeness: does the patch appear to implement the stated logical change completely?
            2. Consistency: are dependent canonical documents, registries, routing, references, and validation controls updated when required?
            3. Cleanup: does the patch create a new canonical artifact while leaving an obsolete or duplicate artifact behind?
            4. Contract alignment: does the change contradict WORKFLOW.md or REPOSITORY_CONTRACT.md?
            5. Semantic gaps: is there a likely broken relationship or missing update that a syntax/structure validator may not detect?
            6. Unnecessary complexity: does the change introduce infrastructure without a demonstrated need?

            Report only actionable findings. Separate:
            - BLOCKING / NEEDS REVIEW: a concrete semantic inconsistency, missing dependent update, incomplete cleanup, or contract conflict.
            - OBSERVATION: a useful but non-blocking concern.
            - NO FINDING: only when no actionable issue is apparent.

            For each finding, cite the changed file/path and explain the concrete evidence. Do not claim certainty when the patch does not provide enough context.