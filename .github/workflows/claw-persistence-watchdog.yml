name: Claw Daily Persistence Watchdog

on:
  schedule:
    # 08:00 Asia/Ho_Chi_Minh; independent artifact check after the 05:00 run.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-daily-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Classify today's Claw artifact and provenance
        id: verify
        shell: bash
        run: |
          RUN_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          REPORT="TOPICS/E. RnD INNOVATION/2. WORKSTREAMS/2.1 PERSONAL_RESEARCH/${RUN_DATE}.md"
          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"

          if [ ! -f "$REPORT" ]; then
            echo "artifact_state=MISSING" >> "$GITHUB_OUTPUT"
            echo "provenance_state=NOT_VERIFIED" >> "$GITHUB_OUTPUT"
            echo "state=MISSING" >> "$GITHUB_OUTPUT"
            echo "Missing report: $REPORT"
            exit 0
          fi

          python - "$REPORT" "$RUN_DATE" <<'PY'
          import os, pathlib, re, sys
          path, run_date = pathlib.Path(sys.argv[1]), sys.argv[2]
          text = path.read_text(encoding="utf-8")
          required = {
              "RUN_DATE": f"**RUN_DATE:** {run_date}",
              "RUN_SLOT": "**RUN_SLOT:** 01",
              "RS-10": "RS-10",
              "RS-11": "RS-11",
              "RS-12": "RS-12",
          }
          missing = [name for name, marker in required.items() if marker not in text]
          manual = bool(re.search(r"MANUAL\s+RECOVERY", text, re.IGNORECASE))
          # Artifact text cannot prove its own scheduler provenance. This watchdog
          # observes main only; it does not have a verified link to the external task.
          artifact_state = "INCOMPLETE" if missing else ("MANUAL_RECOVERY" if manual else "PRESENT_UNVERIFIED")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"artifact_state={artifact_state}\n")
              out.write("provenance_state=NOT_VERIFIED\n")
              out.write(f"state={artifact_state}\n")
          if missing:
              print("Incomplete report; missing markers:", ", ".join(missing))
          else:
              print(f"Artifact state: {artifact_state}; scheduled provenance: NOT_VERIFIED.")
          PY

      - name: Open or reuse a GitHub issue when artifact is missing/incomplete
        if: steps.verify.outputs.state == 'MISSING' || steps.verify.outputs.state == 'INCOMPLETE'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.verify.outputs.run_date }}
          REPORT: ${{ steps.verify.outputs.report }}
          STATE: ${{ steps.verify.outputs.state }}
        shell: bash
        run: |
          TITLE="Claw daily report ${STATE}: ${RUN_DATE}"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Existing watchdog issue #$EXISTING; no duplicate created."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "The independent Claw persistence watchdog found **${STATE}** for ${RUN_DATE} (Asia/Ho_Chi_Minh).\n\nExpected artifact: \`${REPORT}\`\n\nThis check classifies repository artifact presence/completeness only. It does not prove that the external 05:00 scheduled task executed; scheduler provenance remains **NOT_VERIFIED** unless independently verified from the scheduler's own execution record. Recover missing/incomplete output without overwriting human review.\n\nWatchdog run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
