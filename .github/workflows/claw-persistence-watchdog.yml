name: Claw Daily Persistence Watchdog

on:
  schedule:
    # 08:00 Asia/Ho_Chi_Minh; independent artifact check after the 05:00 run.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-daily-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Classify today's Claw artifact and provenance
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          REPORT="TOPICS/E. RnD INNOVATION/2. WORKSTREAMS/2.1 PERSONAL_RESEARCH/${RUN_DATE}.md"
          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"
          python scripts/claw_persistence.py classify --date "$RUN_DATE" --report "$REPORT" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          if [ ! -f "$REPORT" ]; then
            echo "Missing report: $REPORT"
          fi

      - name: Open or reuse a GitHub issue when artifact is missing/incomplete
        if: steps.verify.outputs.state == 'MISSING' || steps.verify.outputs.state == 'INCOMPLETE'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.verify.outputs.run_date }}
          REPORT: ${{ steps.verify.outputs.report }}
          STATE: ${{ steps.verify.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Claw daily report ${STATE}: ${RUN_DATE}"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Existing watchdog issue #$EXISTING; no duplicate created."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "The independent Claw persistence watchdog found **${STATE}** for ${RUN_DATE} (Asia/Ho_Chi_Minh).\n\nExpected artifact: `${REPORT}`\n\nThis workflow is **monitoring and alerting only**; it does not execute Claw research or recover missing content. It does not prove that the external 05:00 scheduled task executed; scheduler provenance remains **NOT_VERIFIED** unless independently verified from the scheduler's own execution record. Recover missing/incomplete output through the repository's normal review and persistence workflow without overwriting human-reviewed content.\n\nWatchdog run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Close stale watchdog issues after artifact recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="TOPICS/E. RnD INNOVATION/2. WORKSTREAMS/2.1 PERSONAL_RESEARCH"
          RECOVERED="$(gh issue list --state open --search "Claw daily report" --limit 100 --json number,title | python scripts/claw_persistence.py recovered-issues --report-dir "$REPORT_DIR")"
          if [ -z "$RECOVERED" ]; then
            echo "No recovered Claw watchdog incidents to close."
            exit 0
          fi
          while IFS= read -r ISSUE_NUMBER; do
            [ -n "$ISSUE_NUMBER" ] || continue
            gh issue close "$ISSUE_NUMBER" --reason completed --comment "Closed by the persistence watchdog because the date-specific report now exists and passes the required content checks. This confirms artifact recovery only; external scheduler provenance remains **NOT_VERIFIED**."
          done <<< "$RECOVERED"
