name: Claw Weekly Persistence Watchdog

on:
  schedule:
    # 08:00 Asia/Ho_Chi_Minh every Monday; summarize the previous Monday-Sunday.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-summary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Count previous week's daily Claw reports
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os
          import sys

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from claw_persistence import classify_report_path, REPORT_RELATIVE_PATH

          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          this_monday = today - timedelta(days=today.weekday())
          week_start = this_monday - timedelta(days=7)
          week_end = this_monday - timedelta(days=1)
          report_dir = Path(str(REPORT_RELATIVE_PATH))
          rows = []
          complete = 0
          incomplete = 0
          missing = 0
          manual = 0

          day = week_start
          while day <= week_end:
              date_text = day.isoformat()
              path = report_dir / f"{date_text}.md"
              result = classify_report_path(path, date_text)
              state = str(result["artifact_state"])
              if state == "PRESENT_UNVERIFIED":
                  complete += 1
              elif state == "MANUAL_RECOVERY":
                  complete += 1
                  manual += 1
              elif state == "INCOMPLETE":
                  incomplete += 1
              else:
                  missing += 1
              rows.append(f"| {date_text} | {state} | [Report]({path.as_posix()}) |")
              day += timedelta(days=1)

          title = f"Claw weekly persistence summary: {week_start.isoformat()} to {week_end.isoformat()}"
          body = [
              "# ADTD Claw weekly persistence summary",
              "",
              f"**Reporting period:** {week_start.isoformat()} to {week_end.isoformat()} (Asia/Ho_Chi_Minh)",
              "",
              f"- **Complete daily reports on main:** {complete}/7",
              f"- **Incomplete daily reports on main:** {incomplete}",
              f"- **Missing daily reports:** {missing}",
              f"- **Manual-recovery reports included in complete count:** {manual}",
              "",
              "Counts are based on the date-specific Markdown artifacts currently present on main. This confirms repository artifact state, not when an external scheduled task ran. Scheduler provenance remains NOT_VERIFIED unless independently confirmed from the scheduler's execution record.",
              "",
              "| Daily report date | Artifact state | Path |",
              "|---|---|---|",
              *rows,
              "",
              f"Watchdog run: https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
          ]
          body_text = "\n".join(body)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(body_text + "\n", encoding="utf-8")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              f"week_start={week_start.isoformat()}\n"
              f"week_end={week_end.isoformat()}\n"
              f"complete={complete}\n"
              f"incomplete={incomplete}\n"
              f"missing={missing}\n"
              f"title={title}\n"
              "body<<WEEKLY_BODY\n"
              + body_text + "\nWEEKLY_BODY\n",
              encoding="utf-8",
          )
          PY

      - name: Open or reuse the weekly summary issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.summary.outputs.title }}
          BODY: ${{ steps.summary.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --state all --search "$TITLE" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$EXISTING" ]; then
            echo "Weekly summary issue #$EXISTING already exists; no duplicate created."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY"

      - name: Close stale daily incidents after artifact recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="TOPICS/E. RnD INNOVATION/2. WORKSTREAMS/2.1 PERSONAL_RESEARCH"
          RECOVERED="$(gh issue list --state open --search "Claw daily report" --limit 100 --json number,title | python scripts/claw_persistence.py recovered-issues --report-dir "$REPORT_DIR")"
          if [ -z "$RECOVERED" ]; then
            echo "No recovered Claw watchdog incidents to close."
            exit 0
          fi
          while IFS= read -r ISSUE_NUMBER; do
            [ -n "$ISSUE_NUMBER" ] || continue
            gh issue close "$ISSUE_NUMBER" --reason completed --comment "Closed by the weekly persistence watchdog because the date-specific report now exists and passes the required content checks. This confirms artifact recovery only; external scheduler provenance remains NOT_VERIFIED."
          done <<< "$RECOVERED"
