<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Review · Second-Brain</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#263750;--text:#e8eef7;--muted:#a4b4c9;--blue:#8bbcff;--cyan:#72dfd0;--amber:#f2c879}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:0 22px}header{padding:22px 0;border-bottom:1px solid var(--line)}a{color:var(--blue);text-decoration:none}.crumb{font-size:13px;color:var(--muted)}h1{font-size:34px;margin:8px 0 3px}.muted{color:var(--muted)}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}.filters button[aria-pressed=true]{background:#d8eaff;color:#102039;border-color:#d8eaff}.section{margin:25px 0}.section h2{font-size:20px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:17px}.card h3{font-size:17px;margin:5px 0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.badge{border:1px solid #36516c;border-radius:20px;padding:2px 8px;font-size:11px;color:#c8d8ec}.badge.warn{border-color:#80652d;color:var(--amber)}.card p{font-size:13px;color:var(--muted);margin:8px 0}.fields{font-size:13px;margin:8px 0}.fields b{color:#dce8f7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:13px;font-weight:700}.empty{padding:24px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}footer{padding:24px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:35px}@media(max-width:700px){.cards{grid-template-columns:1fr}h1{font-size:28px}}</style></head><body><div class="wrap"><header><div class="crumb"><a href="./">← All topics</a> / Career</div><h1>Career review</h1><div class="muted">Review cơ hội nghề nghiệp và tín hiệu công ty ngay tại đây — không cần mở repository.</div></header><div class="bar"><div id="report-meta" class="muted">Đang tải báo cáo…</div><div class="filters" id="filters"><button data-filter="all" aria-pressed="true">Tất cả</button><button data-filter="job" aria-pressed="false">Việc làm</button><button data-filter="company" aria-pressed="false">Company Radar</button><button data-filter="remote" aria-pressed="false">Remote / AI</button></div></div><main id="content"></main><footer>Read-only view · Thông tin được trích từ Career weekly report. Luôn kiểm tra trạng thái và điều kiện tuyển dụng trước khi ứng tuyển. <a href="TOPICS/B.%20CAREER/README.html">Career context</a></footer></div><script>
let data=[];let filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const groups=[['job','1. Cơ hội việc làm'],['company','2. Company Radar'],['remote','3. Remote / AI']];let html='';for(const [kind,title] of groups){if(filter!=='all'&&filter!==kind)continue;const rows=data.filter(x=>x.kind===kind);html+=`<section class="section"><h2>${title} <span class="muted">(${rows.length})</span></h2>`;if(!rows.length)html+='<div class="empty">Không có mục trong báo cáo hiện tại.</div>';else html+='<div class="cards">'+rows.map(x=>`<article class="card"><div class="muted">${esc(x.priority||'REVIEW')} · ${esc(x.group||x.signal||'')}</div><h3>${esc(x.title||x.company)}</h3><div class="meta"><span class="badge">${esc(x.company||x.platform||'')}</span><span class="badge">${esc(x.location||'Chưa rõ địa điểm')}</span><span class="badge ${/partial|unknown|verify|undisclosed/i.test((x.verified||'')+' '+(x.status||''))?'warn':''}">${esc(x.status||x.verified||'Cần review')}</span></div><p>${esc(x.evidence||x.fit||x.signal_detail||'')}</p><div class="fields"><b>Điểm cần lưu ý:</b> ${esc(x.risk||x.gaps||'Chưa ghi nhận')}</div><div class="fields"><b>Đề xuất:</b> ${esc(x.action||'Review thông tin trước khi quyết định')}</div><div class="actions">${x.apply_url?'<a target="_blank" rel="noopener" href="'+esc(x.apply_url)+'">Xem tin tuyển dụng ↗</a>':''}<a href="${esc(x.report_url)}">Mở báo cáo đầy đủ →</a></div></article>`).join('')+'</div>';html+='</section>'}document.getElementById('content').innerHTML=html}
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});
fetch('career-data.json').then(r=>r.json()).then(d=>{data=d.items||[];document.getElementById('report-meta').textContent='Nguồn: '+d.report_title+' · '+d.report_date+' · '+data.length+' mục';render()}).catch(()=>{document.getElementById('content').innerHTML='<div class="empty">Chưa tải được dữ liệu Career. Kiểm tra lại Pages build.</div>'});
</script></body></html>
