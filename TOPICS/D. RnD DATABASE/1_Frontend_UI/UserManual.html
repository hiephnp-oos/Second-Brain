<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      /* Reset lề và kích thước để iframe tràn viền Popup */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* Ẩn thanh cuộn thừa của Popup */
        background-color: #f8f9fa;
      }
      
      /* Cấu hình iframe hiển thị mượt mà */
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- Sử dụng đuôi /preview để ẩn thanh công cụ chỉnh sửa của Google Docs -->
    <iframe src="https://docs.google.com/document/d/18fzqq9FqAbMkMHSKMxZUNyPsrv95J64FUBZiikMZmfM/preview"></iframe>
  </body>
</html>
